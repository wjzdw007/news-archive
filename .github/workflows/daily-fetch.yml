name: daily-fetch

on:
  schedule:
    # every 4 hours UTC — P0 SLA published_at→fetched_at ≤ 4h
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 87 sequential RSS sources + enrich + 7-day brief previously hit the 30m
    # GHA job cap (runs 39243037763 / 39340262352). Fetch now overlaps RSS and
    # caps the RSS wave; brief has its own step timeout. 45m leaves room for
    # Persist after a slow enrich without cancelling the job.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore SQLite from data branch
        id: restore-db
        run: |
          set -euo pipefail
          mkdir -p data
          
          # Try to fetch the data branch and extract archive.sqlite3
          if git fetch origin data:data 2>/dev/null; then
            echo "Data branch exists, attempting to restore archive.sqlite3..."
            if git show data:data/archive.sqlite3 > data/archive.sqlite3 2>/dev/null; then
              echo "restored=true" >> "$GITHUB_OUTPUT"
              echo "✓ Restored archive.sqlite3 from data branch"
              ls -lh data/archive.sqlite3
            else
              echo "restored=false" >> "$GITHUB_OUTPUT"
              echo "⚠ Data branch exists but no archive.sqlite3 found, starting fresh"
            fi
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "⚠ No data branch found, starting fresh DB (first run OK)"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch feeds into SQLite + JSONL
        id: fetch
        run: |
          set -euo pipefail
          mkdir -p data
          # CLI writes the enrich coverage board to GITHUB_STEP_SUMMARY
          # (totals / per-source backoff / private snapshot coverage).
          # Public Pages/JSON never get content_snapshot or a /stats page.
          PYTHONPATH=src python -m news_archive \
            --db data/archive.sqlite3 \
            --export-jsonl data/archive.jsonl \
            --json | tee data/run-stats.json

      - name: Run P0 acceptance validation
        id: validate
        run: |
          PYTHONPATH=src python -m news_archive.validate \
            --db data/archive.sqlite3 \
            --stats data/run-stats.json \
            --output-meta data/validation-meta.json

      - name: Generate daily brief (soft-fail)
        # Missing DAILY_BRIEF_API_KEY / DAILY_BRIEF_API_BASE, model errors, or
        # empty day write failed|empty and must not break fetch or persist.
        # Model id is code-default deepseek/deepseek-flash (not a Secret);
        # override with env DAILY_BRIEF_MODEL if needed.
        # Step + CLI deadlines: a hung LLM must not eat the job timeout and
        # skip Persist (run 39243037763). continue-on-error keeps fetch green.
        if: always() && steps.fetch.outcome == 'success' && hashFiles('data/archive.sqlite3') != ''
        continue-on-error: true
        timeout-minutes: 8
        env:
          DAILY_BRIEF_API_KEY: ${{ secrets.DAILY_BRIEF_API_KEY }}
          DAILY_BRIEF_API_BASE: ${{ secrets.DAILY_BRIEF_API_BASE }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m news_archive.daily_brief \
            --db data/archive.sqlite3 \
            --days 7 \
            --deadline-seconds 300 \
            --json

      - name: Persist SQLite to data branch
        # CRITICAL: Persist runs if fetch succeeded, even if latency validation failed
        # This ensures incremental data is never lost due to SLA violations
        if: always() && steps.fetch.outcome == 'success' && hashFiles('data/archive.sqlite3') != ''
        run: |
          set -euo pipefail
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Copy archive.sqlite3 + validation-meta to temp BEFORE switching branches
          # (orphan/git rm wipes workspace; also avoids same-file cp on sqlite)
          cp "$GITHUB_WORKSPACE/data/archive.sqlite3" "$RUNNER_TEMP/archive.sqlite3"
          if [ -f "$GITHUB_WORKSPACE/data/validation-meta.json" ]; then
            cp "$GITHUB_WORKSPACE/data/validation-meta.json" "$RUNNER_TEMP/validation-meta.json"
          fi
          
          # Try to checkout data branch, or create it as orphan if it doesn't exist
          if git fetch origin data:data 2>/dev/null; then
            git checkout data
          else
            echo "Creating new orphan data branch..."
            git checkout --orphan data
            git rm -rf . 2>/dev/null || true
            mkdir -p data
          fi
          
          # Copy sqlite from temp to data branch
          cp "$RUNNER_TEMP/archive.sqlite3" data/archive.sqlite3
          
          # Read latency_sla_passed / latency_soft_miss from TEMP copy
          # (workspace meta is gone after checkout). Single soft miss keeps
          # passed=true and sets soft_miss so only consecutive large-N reds.
          LATENCY_PASSED="null"
          LATENCY_SOFT_MISS="false"
          if [ -f "$RUNNER_TEMP/validation-meta.json" ]; then
            LATENCY_PASSED=$(python3 -c "import json; print(json.dumps(json.load(open('$RUNNER_TEMP/validation-meta.json')).get('latency_sla_passed', None)))" 2>/dev/null || echo "null")
            LATENCY_SOFT_MISS=$(python3 -c "import json; print(json.dumps(bool(json.load(open('$RUNNER_TEMP/validation-meta.json')).get('latency_soft_miss', False))))" 2>/dev/null || echo "false")
          fi
          
          # Create run metadata with latency SLA status for consecutive check
          cat > data/LAST_RUN.json <<EOF
          {
            "run_id": "${{ github.run_id }}",
            "run_number": ${{ github.run_number }},
            "run_attempt": ${{ github.run_attempt }},
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflow": "${{ github.workflow }}",
            "latency_sla_passed": ${LATENCY_PASSED},
            "latency_soft_miss": ${LATENCY_SOFT_MISS}
          }
          EOF
          
          # Stage and commit
          git add data/archive.sqlite3 data/LAST_RUN.json
          
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes to persist (DB unchanged)"
          else
            git commit -m "Archive update from run ${{ github.run_id }}"
            
            # Push with retry on conflict
            for attempt in 1 2 3; do
              if git push origin data; then
                echo "✓ Successfully pushed to data branch"
                break
              else
                if [ $attempt -lt 3 ]; then
                  echo "⚠ Push failed (attempt $attempt/3), pulling and retrying..."
                  git pull --rebase origin data
                else
                  echo "❌ Failed to push after 3 attempts - concurrent update conflict"
                  exit 1
                fi
              fi
            done
          fi
          
          # Return to original branch
          git checkout "${{ github.ref_name }}"

      - name: Test high-frequency dedup
        run: |
          PYTHONPATH=src python tests/test_dedup.py

      - name: Test archive-first page enrich (product gate)
        run: |
          PYTHONPATH=src python tests/test_enrich.py

      - name: Test thin RSS skip (Required Fields)
        run: |
          PYTHONPATH=src python tests/test_required_fields.py

      - name: Test RSS timeout retry + soft-fail (keep persist)
        run: |
          PYTHONPATH=src python tests/test_fetch_soft_fail.py

      - name: Test latency consecutive soft-miss (keep persist green)
        run: |
          PYTHONPATH=src python tests/test_latency_consecutive.py

      - name: Upload archive artifact
        if: always() && hashFiles('data/archive.sqlite3') != ''
        uses: actions/upload-artifact@v4
        with:
          name: news-archive-${{ github.run_id }}
          path: |
            data/archive.sqlite3
            data/archive.jsonl
            data/run-stats.json
          if-no-files-found: error
          retention-days: 90