name: x-fetch
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"
jobs:
  x-fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # To push to data branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      
      - name: Restore X posts DB from data branch
        id: restore-db
        run: |
          set -euo pipefail
          mkdir -p data
          
          # Try to fetch x_posts.sqlite3 from data branch
          if git fetch origin data:data 2>/dev/null; then
            echo "Data branch exists, attempting to restore x_posts DB..."
            if git show data:data/x_posts.sqlite3 > data/x_posts.sqlite3 2>/dev/null; then
              echo "restored=true" >> "$GITHUB_OUTPUT"
              echo "✓ Restored x_posts.sqlite3 from data branch"
              ls -lh data/x_posts.sqlite3
            else
              echo "restored=false" >> "$GITHUB_OUTPUT"
              echo "⚠ Data branch exists but no x_posts.sqlite3 found, starting fresh"
            fi
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "⚠ No data branch found, starting fresh DB (first run OK)"
          fi
      
      - name: Detect X credentials and set mode
        id: detect-creds
        run: |
          if [[ -n "${{ secrets.X_BEARER_TOKEN }}" && -n "${{ secrets.X_AUTH_TOKEN }}" && -n "${{ secrets.X_CT0_TOKEN }}" ]]; then
            echo "mode=live" >> "$GITHUB_OUTPUT"
            echo "✓ X credentials detected, using live mode"
          else
            echo "mode=mock" >> "$GITHUB_OUTPUT"
            echo "⚠ X credentials missing, using mock mode"
          fi
      
      - name: Fetch X posts
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0_TOKEN: ${{ secrets.X_CT0_TOKEN }}
          X_CSRF_TOKEN: ${{ secrets.X_CSRF_TOKEN }}
        run: |
          mkdir -p data
          PYTHONPATH=src python -m news_archive.x_cli \
            --db data/x_posts.sqlite3 \
            --mode ${{ steps.detect-creds.outputs.mode }} \
            --json | tee data/x-run-stats.json
      
      - name: Persist X posts DB to data branch
        if: always() && hashFiles('data/x_posts.sqlite3') != ''
        run: |
          set -euo pipefail
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Copy DB + stats to temp
          cp "$GITHUB_WORKSPACE/data/x_posts.sqlite3" "$RUNNER_TEMP/x_posts.sqlite3"
          cp "$GITHUB_WORKSPACE/data/x-run-stats.json" "$RUNNER_TEMP/x-run-stats.json"
          
          # Checkout or create data branch
          if git fetch origin data:data 2>/dev/null; then
            git checkout data
          else
            echo "Creating new orphan data branch..."
            git checkout --orphan data
            git rm -rf . 2>/dev/null || true
            mkdir -p data
          fi
          
          # Copy DB back
          cp "$RUNNER_TEMP/x_posts.sqlite3" data/x_posts.sqlite3
          
          # Create run metadata
          cat > data/X_LAST_RUN.json <<EOF
          {
            "run_id": "${{ github.run_id }}",
            "run_number": ${{ github.run_number }},
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflow": "${{ github.workflow }}",
            "mode": "${{ steps.detect-creds.outputs.mode }}"
          }
          EOF
          
          # Copy stats
          if [ -f "$RUNNER_TEMP/x-run-stats.json" ]; then
            cp "$RUNNER_TEMP/x-run-stats.json" data/X_LAST_RUN_STATS.json
          fi
          
          # Stage and commit
          git add data/x_posts.sqlite3 data/X_LAST_RUN.json data/X_LAST_RUN_STATS.json
          
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes to persist (DB unchanged)"
          else
            git commit -m "X posts update from run ${{ github.run_id }} (${{ steps.detect-creds.outputs.mode }} mode)"
            
            # Push with retry on conflict
            for attempt in 1 2 3; do
              if git push origin data; then
                echo "✓ Successfully pushed to data branch"
                break
              else
                if [ $attempt -lt 3 ]; then
                  echo "⚠ Push failed (attempt $attempt/3), pulling and retrying..."
                  git pull --rebase origin data
                else
                  echo "❌ Failed to push after 3 attempts"
                  exit 1
                fi
              fi
            done
          fi
          
          # Return to original branch
          git checkout "${{ github.ref_name }}"
      
      - name: Upload X posts artifact
        if: always() && hashFiles('data/x_posts.sqlite3') != ''
        uses: actions/upload-artifact@v4
        with:
          name: x-posts-${{ github.run_id }}
          path: |
            data/x_posts.sqlite3
            data/x-run-stats.json
          retention-days: 30
