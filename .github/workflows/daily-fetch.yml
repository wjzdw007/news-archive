name: daily-fetch

on:
  schedule:
    # every 4 hours UTC — P0 SLA published_at→fetched_at ≤ 4h
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch feeds into SQLite + JSONL
        id: fetch
        run: |
          set -euo pipefail
          mkdir -p data
          PYTHONPATH=src python -m news_archive \
            --db data/archive.sqlite3 \
            --export-jsonl data/archive.jsonl \
            --json | tee data/run-stats.json

      - name: Run P0 acceptance validation
        run: |
          PYTHONPATH=src python -m news_archive.validate \
            --db data/archive.sqlite3 \
            --stats data/run-stats.json

      - name: Test high-frequency dedup
        run: |
          PYTHONPATH=src python tests/test_dedup.py

      - name: Upload archive artifact
        if: always() && hashFiles('data/archive.sqlite3') != ''
        uses: actions/upload-artifact@v4
        with:
          name: news-archive-${{ github.run_id }}
          path: |
            data/archive.sqlite3
            data/archive.jsonl
            data/run-stats.json
          if-no-files-found: error
          retention-days: 90
