name: x-fetch
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"
jobs:
  x-fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # To push to data branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      
      - name: Restore archive.sqlite3 from data branch
        id: restore-db
        run: |
          set -euo pipefail
          mkdir -p data

          # Shared DB (articles + x_posts). Same gzip payload as daily-fetch.
          if git fetch origin data:data 2>/dev/null; then
            echo "Data branch exists, attempting to restore archive..."
            set +e
            bash scripts/data_branch_archive.sh restore data/archive.sqlite3
            restore_rc=$?
            set -e
            if [ "$restore_rc" -eq 0 ]; then
              echo "restored=true" >> "$GITHUB_OUTPUT"
              echo "✓ Restored archive.sqlite3 from data branch"
              ls -lh data/archive.sqlite3
            elif [ "$restore_rc" -eq 2 ]; then
              echo "❌ Archive payload on data branch failed integrity_check"
              exit 1
            else
              echo "restored=false" >> "$GITHUB_OUTPUT"
              echo "⚠ Data branch exists but no archive payload found, starting fresh"
            fi
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "⚠ No data branch found, starting fresh DB (first run OK)"
          fi
      
      - name: Detect X credentials and set mode
        id: detect-creds
        run: |
          if [[ -n "${{ secrets.X_AUTH_TOKEN }}" && -n "${{ secrets.X_CT0_TOKEN }}" ]]; then
            echo "mode=live" >> "$GITHUB_OUTPUT"
            echo "✓ X credentials detected (auth_token + ct0), using live mode"
          else
            echo "mode=mock" >> "$GITHUB_OUTPUT"
            echo "⚠ X credentials missing, using mock mode"
          fi
      
      - name: Fetch X posts
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0_TOKEN: ${{ secrets.X_CT0_TOKEN }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_CSRF_TOKEN: ${{ secrets.X_CSRF_TOKEN }}
        run: |
          mkdir -p data
          PYTHONPATH=src python -m news_archive.x_cli \
            --db data/archive.sqlite3 \
            --mode ${{ steps.detect-creds.outputs.mode }} \
            --json | tee data/x-run-stats.json
      
      - name: Persist archive.sqlite3 to data branch
        if: always() && hashFiles('data/archive.sqlite3') != ''
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp "$GITHUB_WORKSPACE/data/archive.sqlite3" "$RUNNER_TEMP/archive.sqlite3"
          cp "$GITHUB_WORKSPACE/data/x-run-stats.json" "$RUNNER_TEMP/x-run-stats.json"

          bash scripts/data_branch_archive.sh pack \
            "$RUNNER_TEMP/archive.sqlite3" \
            "$RUNNER_TEMP/archive-packed"

          ORIGINAL_REF="${{ github.ref_name }}"
          ORIGINAL_SHA="${{ github.sha }}"
          restore_workspace() {
            local rc=$?
            trap - EXIT
            set +e
            git checkout -f "$ORIGINAL_REF" 2>/dev/null || git checkout -f "$ORIGINAL_SHA"
            mkdir -p "$GITHUB_WORKSPACE/data"
            cp "$RUNNER_TEMP/archive.sqlite3" "$GITHUB_WORKSPACE/data/archive.sqlite3"
            if [ -f "$RUNNER_TEMP/x-run-stats.json" ]; then
              cp "$RUNNER_TEMP/x-run-stats.json" "$GITHUB_WORKSPACE/data/x-run-stats.json"
            fi
            exit "$rc"
          }
          trap restore_workspace EXIT

          if git fetch origin data:data 2>/dev/null; then
            git checkout data
          else
            echo "Creating new orphan data branch..."
            git checkout --orphan data
            git rm -rf . 2>/dev/null || true
            mkdir -p data
          fi

          mkdir -p data
          git rm -f --ignore-unmatch data/archive.sqlite3
          git rm -f --ignore-unmatch data/archive.sqlite3.gz
          if old_parts=$(git ls-files 'data/archive.sqlite3.gz.*'); then
            if [ -n "$old_parts" ]; then
              git rm -f -- $old_parts
            fi
          fi
          rm -f data/archive.sqlite3 data/archive.sqlite3.gz
          rm -f data/archive.sqlite3.gz.*

          python3 - "$RUNNER_TEMP/archive-packed/PACK_META.json" <<'PY'
          import json, shutil, sys
          from pathlib import Path
          meta = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          packed = Path(sys.argv[1]).parent
          dest = Path("data")
          dest.mkdir(parents=True, exist_ok=True)
          for name in meta["files"]:
              shutil.copy2(packed / name, dest / name)
          PY

          cat > data/X_LAST_RUN.json <<EOF
          {
            "run_id": "${{ github.run_id }}",
            "run_number": ${{ github.run_number }},
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflow": "${{ github.workflow }}",
            "mode": "${{ steps.detect-creds.outputs.mode }}"
          }
          EOF

          if [ -f "$RUNNER_TEMP/x-run-stats.json" ]; then
            cp "$RUNNER_TEMP/x-run-stats.json" data/X_LAST_RUN_STATS.json
          fi

          git add data/X_LAST_RUN.json data/X_LAST_RUN_STATS.json
          python3 - "$RUNNER_TEMP/archive-packed/PACK_META.json" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          meta = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          paths = [f"data/{name}" for name in meta["files"]]
          subprocess.run(["git", "add", "--", *paths], check=True)
          PY

          if git diff --cached --quiet; then
            echo "No changes to persist (DB unchanged)"
          else
            git commit -m "X posts update from run ${{ github.run_id }} (${{ steps.detect-creds.outputs.mode }} mode)"

            for attempt in 1 2 3; do
              if git push origin data; then
                echo "✓ Successfully pushed packed archive to data branch"
                break
              else
                if [ $attempt -lt 3 ]; then
                  echo "⚠ Push failed (attempt $attempt/3), pulling and retrying..."
                  git pull --rebase origin data
                else
                  echo "❌ Failed to push after 3 attempts"
                  exit 1
                fi
              fi
            done
          fi
      
      - name: Upload archive artifact
        if: always() && hashFiles('data/archive.sqlite3') != ''
        uses: actions/upload-artifact@v4
        with:
          name: x-posts-${{ github.run_id }}
          path: |
            data/archive.sqlite3
            data/x-run-stats.json
          retention-days: 30
