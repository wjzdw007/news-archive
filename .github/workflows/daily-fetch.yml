name: daily-fetch

on:
  schedule:
    # every 4 hours UTC — P0 SLA published_at→fetched_at ≤ 4h
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 45m job cap. RSS is 8-way + 600s wave (runs 39535458475 / 39539744777
    # finished RSS in ~7s then hung on full-archive O(n²) recluster inside
    # this Fetch step). Cluster is now a 24h window + 1500-candidate cap.
    # Brief has its own 12m step timeout so a hung LLM cannot skip Persist.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore SQLite from data branch
        id: restore-db
        run: |
          set -euo pipefail
          mkdir -p data

          # gzip (or split gzip parts) on the data branch; fallback to the
          # legacy uncompressed blob so the first run after this hotfix works.
          if git fetch origin data:data 2>/dev/null; then
            echo "Data branch exists, attempting to restore archive..."
            set +e
            bash scripts/data_branch_archive.sh restore data/archive.sqlite3
            restore_rc=$?
            set -e
            if [ "$restore_rc" -eq 0 ]; then
              echo "restored=true" >> "$GITHUB_OUTPUT"
              echo "✓ Restored archive.sqlite3 from data branch"
              ls -lh data/archive.sqlite3
            elif [ "$restore_rc" -eq 2 ]; then
              echo "❌ Archive payload on data branch failed integrity_check"
              exit 1
            else
              echo "restored=false" >> "$GITHUB_OUTPUT"
              echo "⚠ Data branch exists but no archive payload found, starting fresh"
            fi
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "⚠ No data branch found, starting fresh DB (first run OK)"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch feeds into SQLite + JSONL
        id: fetch
        run: |
          set -euo pipefail
          mkdir -p data
          # CLI writes the enrich coverage board to GITHUB_STEP_SUMMARY
          # (totals / per-source backoff / private snapshot coverage).
          # Public Pages/JSON never get content_snapshot or a /stats page.
          PYTHONPATH=src python -m news_archive \
            --db data/archive.sqlite3 \
            --export-jsonl data/archive.jsonl \
            --json | tee data/run-stats.json

      - name: Run P0 acceptance validation
        id: validate
        run: |
          PYTHONPATH=src python -m news_archive.validate \
            --db data/archive.sqlite3 \
            --stats data/run-stats.json \
            --output-meta data/validation-meta.json

      - name: Generate daily brief
        id: daily-brief
        # Older days may still soft-fail. Today's failed|missing must not stay
        # green (run 40258264336: LKEAP read timeout, then "deadline 300s
        # reached", JSON still "ok": true, live site 「当日摘要生成失败」).
        # continue-on-error lets Persist write the failed row; the later
        # "Fail if today's daily brief is failed or missing" step reds the run.
        # Today is generated first with retries, then failed historical days
        # (live 2026-10-25/24/23/21) are backfilled. Per-request read timeout
        # is 90s; CLI deadline 600s so one slow LKEAP call cannot burn the
        # window. Model id stays code-default deepseek/deepseek-flash.
        if: always() && steps.fetch.outcome == 'success' && hashFiles('data/archive.sqlite3') != ''
        continue-on-error: true
        timeout-minutes: 12
        env:
          DAILY_BRIEF_API_KEY: ${{ secrets.DAILY_BRIEF_API_KEY }}
          DAILY_BRIEF_API_BASE: ${{ secrets.DAILY_BRIEF_API_BASE }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m news_archive.daily_brief \
            --db data/archive.sqlite3 \
            --days 7 \
            --deadline-seconds 600 \
            --write-status "$RUNNER_TEMP/daily-brief-today.json" \
            --json

      - name: Persist SQLite to data branch
        # CRITICAL: Persist runs if fetch succeeded, even if latency validation failed
        # This ensures incremental data is never lost due to SLA violations
        if: always() && steps.fetch.outcome == 'success' && hashFiles('data/archive.sqlite3') != ''
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Copy live DB + sidecar files BEFORE switching branches.
          # orphan/git rm wipes the workspace; checkout data also drops src/
          # (run 40500314784: push hit GH 100MB, never came back, brief check
          # died with "No module named news_archive.daily_brief").
          cp "$GITHUB_WORKSPACE/data/archive.sqlite3" "$RUNNER_TEMP/archive.sqlite3"
          if [ -f "$GITHUB_WORKSPACE/data/validation-meta.json" ]; then
            cp "$GITHUB_WORKSPACE/data/validation-meta.json" "$RUNNER_TEMP/validation-meta.json"
          fi
          if [ -f "$GITHUB_WORKSPACE/data/archive.jsonl" ]; then
            cp "$GITHUB_WORKSPACE/data/archive.jsonl" "$RUNNER_TEMP/archive.jsonl"
          fi
          if [ -f "$GITHUB_WORKSPACE/data/run-stats.json" ]; then
            cp "$GITHUB_WORKSPACE/data/run-stats.json" "$RUNNER_TEMP/run-stats.json"
          fi

          # VACUUM + gzip-9 (+ 90MiB split). Never push the raw sqlite blob.
          bash scripts/data_branch_archive.sh pack \
            "$RUNNER_TEMP/archive.sqlite3" \
            "$RUNNER_TEMP/archive-packed"

          ORIGINAL_REF="${{ github.ref_name }}"
          ORIGINAL_SHA="${{ github.sha }}"
          restore_workspace() {
            local rc=$?
            trap - EXIT
            set +e
            git checkout -f "$ORIGINAL_REF" 2>/dev/null || git checkout -f "$ORIGINAL_SHA"
            mkdir -p "$GITHUB_WORKSPACE/data"
            cp "$RUNNER_TEMP/archive.sqlite3" "$GITHUB_WORKSPACE/data/archive.sqlite3"
            if [ -f "$RUNNER_TEMP/archive.jsonl" ]; then
              cp "$RUNNER_TEMP/archive.jsonl" "$GITHUB_WORKSPACE/data/archive.jsonl"
            fi
            if [ -f "$RUNNER_TEMP/run-stats.json" ]; then
              cp "$RUNNER_TEMP/run-stats.json" "$GITHUB_WORKSPACE/data/run-stats.json"
            fi
            exit "$rc"
          }
          trap restore_workspace EXIT

          if git fetch origin data:data 2>/dev/null; then
            git checkout data
          else
            echo "Creating new orphan data branch..."
            git checkout --orphan data
            git rm -rf . 2>/dev/null || true
            mkdir -p data
          fi

          mkdir -p data
          # Drop the raw 100MB+ blob so the next tree cannot re-hit GH001.
          git rm -f --ignore-unmatch data/archive.sqlite3
          git rm -f --ignore-unmatch data/archive.sqlite3.gz
          if old_parts=$(git ls-files 'data/archive.sqlite3.gz.*'); then
            if [ -n "$old_parts" ]; then
              git rm -f -- $old_parts
            fi
          fi
          rm -f data/archive.sqlite3 data/archive.sqlite3.gz
          rm -f data/archive.sqlite3.gz.*

          python3 - "$RUNNER_TEMP/archive-packed/PACK_META.json" <<'PY'
          import json, shutil, sys
          from pathlib import Path
          meta = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          packed = Path(sys.argv[1]).parent
          dest = Path("data")
          dest.mkdir(parents=True, exist_ok=True)
          for name in meta["files"]:
              shutil.copy2(packed / name, dest / name)
              print(f"staged packed {name}")
          PY

          # Read latency_sla_passed / latency_soft_miss from TEMP copy
          # (workspace meta is gone after checkout). Single soft miss keeps
          # passed=true and sets soft_miss so only consecutive large-N reds.
          LATENCY_PASSED="null"
          LATENCY_SOFT_MISS="false"
          if [ -f "$RUNNER_TEMP/validation-meta.json" ]; then
            LATENCY_PASSED=$(python3 -c "import json; print(json.dumps(json.load(open('$RUNNER_TEMP/validation-meta.json')).get('latency_sla_passed', None)))" 2>/dev/null || echo "null")
            LATENCY_SOFT_MISS=$(python3 -c "import json; print(json.dumps(bool(json.load(open('$RUNNER_TEMP/validation-meta.json')).get('latency_soft_miss', False))))" 2>/dev/null || echo "false")
          fi

          cat > data/LAST_RUN.json <<EOF
          {
            "run_id": "${{ github.run_id }}",
            "run_number": ${{ github.run_number }},
            "run_attempt": ${{ github.run_attempt }},
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflow": "${{ github.workflow }}",
            "latency_sla_passed": ${LATENCY_PASSED},
            "latency_soft_miss": ${LATENCY_SOFT_MISS}
          }
          EOF

          git add data/LAST_RUN.json
          python3 - "$RUNNER_TEMP/archive-packed/PACK_META.json" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          meta = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          paths = [f"data/{name}" for name in meta["files"]]
          subprocess.run(["git", "add", "--", *paths], check=True)
          PY

          if git diff --cached --quiet; then
            echo "No changes to persist (DB unchanged)"
          else
            git commit -m "Archive update from run ${{ github.run_id }}"

            for attempt in 1 2 3; do
              if git push origin data; then
                echo "✓ Successfully pushed packed archive to data branch"
                break
              else
                if [ $attempt -lt 3 ]; then
                  echo "⚠ Push failed (attempt $attempt/3), pulling and retrying..."
                  git pull --rebase origin data
                else
                  echo "❌ Failed to push after 3 attempts - concurrent update conflict"
                  exit 1
                fi
              fi
            done
          fi

      - name: Test high-frequency dedup
        run: |
          PYTHONPATH=src python tests/test_dedup.py

      - name: Test archive-first page enrich (product gate)
        run: |
          PYTHONPATH=src python tests/test_enrich.py

      - name: Test thin RSS skip (Required Fields)
        run: |
          PYTHONPATH=src python tests/test_required_fields.py

      - name: Test RSS timeout retry + soft-fail (keep persist)
        run: |
          PYTHONPATH=src python tests/test_fetch_soft_fail.py

      - name: Test latency consecutive soft-miss (keep persist green)
        run: |
          PYTHONPATH=src python tests/test_latency_consecutive.py

      - name: Test data-branch archive pack/restore (100MB persist)
        run: |
          PYTHONPATH=src python tests/test_data_branch_archive.py

      - name: Test daily brief today-visibility + timeout
        run: |
          PYTHONPATH=src python tests/test_daily_briefs.py

      - name: Fail if today's daily brief is failed or missing
        # Hard fail so today's hole cannot stay green. Persist already ran.
        # Status file lives in RUNNER_TEMP so the data-branch checkout cannot
        # hide today.
        if: always() && steps.fetch.outcome == 'success' && steps.daily-brief.outcome != 'skipped'
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m news_archive.daily_brief \
            --check-today \
            --status-file "$RUNNER_TEMP/daily-brief-today.json" \
            --db data/archive.sqlite3

      - name: Upload archive artifact
        if: always() && hashFiles('data/archive.sqlite3') != ''
        uses: actions/upload-artifact@v4
        with:
          name: news-archive-${{ github.run_id }}
          path: |
            data/archive.sqlite3
            data/archive.jsonl
            data/run-stats.json
          if-no-files-found: error
          retention-days: 90